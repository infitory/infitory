<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTRPG Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="logo">&#9880;</span>
        <span class="app-name">TTRPG Manager</span>
      </div>
      <nav id="sidebar-nav">
        <button class="nav-item active" data-section="systems">
          <span class="nav-icon">&#128218;</span> Systems
        </button>
        <button class="nav-item" data-section="characters">
          <span class="nav-icon">&#128100;</span> Characters
        </button>
        <button class="nav-item" data-section="sessions">
          <span class="nav-icon">&#128203;</span> Sessions
        </button>
        <button class="nav-item" data-section="dice">
          <span class="nav-icon">&#127922;</span> Dice Roller
        </button>
      </nav>
    </aside>

    <main id="content">
      <!-- Systems Section -->
      <section id="section-systems" class="section active">
        <div id="systems-list-view">
          <div class="section-header">
            <h1>Systems</h1>
            <button id="btn-new-system" class="btn-primary">+ New System</button>
          </div>
          <p class="section-subtitle">Your loaded game rulebooks.</p>
          <div id="systems-list"></div>
          <div id="systems-empty" class="empty-state" style="display:none;">
            <span class="empty-icon">&#128218;</span>
            <p>No systems yet. Create your first one!</p>
          </div>
        </div>

        <div id="systems-editor-view" style="display:none;">
          <div class="editor-header">
            <button id="btn-back-systems" class="btn-back">&#8592; Back</button>
            <input id="system-name-input" class="system-name-input" type="text" placeholder="System name..." />
            <div class="editor-actions">
              <button id="btn-delete-system" class="btn-danger">Delete</button>
              <button id="btn-save-system" class="btn-primary">Save</button>
            </div>
          </div>
          <div class="editor-body">
            <textarea id="system-editor" spellcheck="false" placeholder="Write your system rules in Markdown..."></textarea>
          </div>
          <div id="editor-status" class="editor-status"></div>
        </div>
      </section>

      <!-- Characters Section (placeholder) -->
      <section id="section-characters" class="section">
        <div class="section-header">
          <h1>Characters</h1>
        </div>
        <div class="empty-state">
          <span class="empty-icon">&#128100;</span>
          <p>Characters coming soon.</p>
        </div>
      </section>

      <!-- Sessions Section (placeholder) -->
      <section id="section-sessions" class="section">
        <div class="section-header">
          <h1>Sessions</h1>
        </div>
        <div class="empty-state">
          <span class="empty-icon">&#128203;</span>
          <p>Session logs coming soon.</p>
        </div>
      </section>

      <!-- Dice Roller Section (placeholder) -->
      <section id="section-dice" class="section">
        <div class="section-header">
          <h1>Dice Roller</h1>
        </div>
        <div class="empty-state">
          <span class="empty-icon">&#127922;</span>
          <p>Dice roller coming soon.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-overlay" style="display:none;">
    <div id="modal">
      <h2 id="modal-title">New System</h2>
      <p id="modal-body">Enter a name for your new system:</p>
      <input id="modal-input" type="text" placeholder="e.g. D&D 5e, Pathfinder, Cairn..." />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
